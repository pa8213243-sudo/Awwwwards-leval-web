<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0A0A0E"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C68A61"/>
      <stop offset="100%" stop-color="#A56E49"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161D29"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="188" fill="#F3F4F6"/>

  <g transform="translate(0, 10)">
    <!-- Dark Suit Jacket -->
    <path d="M 90 380 L 120 280 L 160 270 L 200 310 L 240 270 L 280 280 L 310 380 Z" fill="url(#suitGrad)"/>
    <path d="M 80 390 Q 200 340 320 390 L 330 400 L 70 400 Z" fill="#0D0E12"/>
    
    <!-- White Dress Shirt Collar -->
    <polygon points="160,270 200,320 170,270" fill="#FFFFFF"/>
    <polygon points="240,270 200,320 230,270" fill="#E5E7EB"/>
    <polygon points="175,260 200,325 225,260" fill="#FFFFFF"/>

    <!-- Black Tie -->
    <polygon points="193,275 207,275 212,380 200,395 188,380" fill="url(#tieGrad)"/>
    <polygon points="190,265 210,265 206,277 194,277" fill="#111827"/>

    <!-- Neck -->
    <rect x="178" y="220" width="44" height="50" rx="4" fill="#B27852"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="175" rx="52" ry="68" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <ellipse cx="146" cy="180" rx="9" ry="16" fill="#B27852"/>
    <ellipse cx="254" cy="180" rx="9" ry="16" fill="#B27852"/>

    <!-- Dark Neat Hair -->
    <path d="M 146 165 C 146 105, 254 105, 254 165 C 254 120, 230 108, 200 108 C 170 108, 146 120, 146 165 Z" fill="#121214"/>
    <path d="M 148 155 Q 200 112 252 155 Q 245 135 200 135 Q 155 135 148 155 Z" fill="#1C1C21"/>

    <!-- Eyebrows -->
    <path d="M 162 154 Q 177 148 188 153" stroke="#121214" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 212 153 Q 223 148 238 154" stroke="#121214" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="175" cy="168" rx="7" ry="5" fill="#121214"/>
    <ellipse cx="225" cy="168" rx="7" ry="5" fill="#121214"/>
    <circle cx="173" cy="167" r="1.5" fill="#FFFFFF"/>
    <circle cx="223" cy="167" r="1.5" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 200 165 L 196 192 Q 200 196 204 192 Z" fill="#965F3A"/>

    <!-- Mustache & Beard -->
    <path d="M 182 205 Q 200 200 218 205 Q 200 209 182 205 Z" fill="#222228"/>
    <path d="M 190 222 Q 200 226 210 222 Q 200 228 190 222 Z" fill="#222228"/>

    <!-- Lips -->
    <path d="M 186 212 Q 200 216 214 212" stroke="#8A4E2A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
